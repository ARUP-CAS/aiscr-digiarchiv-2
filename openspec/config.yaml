schema: spec-driven

context: |
  Repository: aiscr-digiarchiv-2 - Digitalni archiv AMCR, the digital archive
  and presentation layer for archaeological data within the AIS CR ecosystem.
  Tech stack: Java 17 / Spring backend under web/src/main/java/, Angular
  frontend under web/src/main/ng/ (web/src/main/webapp/ is NOT the frontend),
  XSLT transformations via Saxon 8.7 (XSLT 2.0 only), 14 Apache Solr
  configsets under solr/, Maven builds (web/pom.xml and
  ThumbnailsGenerator/pom.xml). Docker/infrastructure files are maintained
  externally; no automated tests exist (web/src/test/ is absent).
  Governance: AGENTS.md is the assistant entrypoint, CLAUDE.md narrows
  Claude Code usage, CONTRIBUTING.md owns the human contribution workflow
  (branch from dev, PR to dev; merging to main is human-only).
  Agent vendor surfaces are tracked repository content when materialized
  from the aiscr-management hub sync baseline.
  Hub baseline: aiscr-management .agents/sync/repos.toml declares the
  synchronized agent-vendor folders and enrolled workflow assets for this
  repository.

rules:
  proposal:
    - State whether the change affects governance, application behavior, or both.
    - Name any aiscr-management hub baseline or sync path that supplies generated agent assets.
    - Keep governance/bootstrap proposals separate from application behavior changes.
  specs:
    - Use SHALL/MUST for durable behavioral requirements.
    - Use Given/When/Then scenarios for testable contracts.
    - Do not duplicate hub governance bodies; reference the hub baseline when applicable.
  design:
    - State whether files are created locally or expected from hub sync.
    - Call out any operation that requires separate approval, especially config sync apply.
    - Flag changes that can affect Solr schemas, shared APIs, or upstream AMCR compatibility.
  tasks:
    - Include OpenSpec validation after artifact edits.
    - Include a dry-run sync check before any future sync apply.
    - Include usage-log close-out for governance work.
