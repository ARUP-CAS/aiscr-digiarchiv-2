name: New version

on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: 'Tag name following "vx.x.x" semantics (e.g. "v1.0.0"):'
        type: string
        required: true
      citation_update:
        description: 'Update citation and footer'
        type: boolean
        required: true
        default: true

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update_files:
    name: Update citation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.final-sha.outputs.sha }}
    steps:
      - name: Validate tag format
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$NEW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag format. Must be vX.Y.Z"
            exit 1
          fi

      - name: Log-in as AMCR app
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.AISCR_AMCR_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.AISCR_AMCR_ACTIONS_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Check if tag exists
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$NEW_TAG"; then
            echo "Tag already exists!"
            exit 1
          fi

      - name: Update citation and footer
        if: ${{ inputs.citation_update }}
        shell: bash
        env:
          VERSION: ${{ inputs.new_tag }}
          FOOTER_FILE: web/src/main/ng/src/app/components/footer/footer.component.html
        run: |
          set -euo pipefail
          DATE="$(TZ=Europe/Prague date -I)"
          export DATE
          python3 <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path

          CHANGELOG_A = re.compile(
              r"(<a\b(?=[^>]*wiki/Changelog#)[^>]*>)(.*?)(</a>)",
              re.IGNORECASE | re.DOTALL,
          )
          HREF_FRAG = re.compile(r"(wiki/Changelog#)v[0-9]+", re.IGNORECASE)
          VISIBLE_VER = re.compile(r"v[0-9]+\.[0-9]+\.[0-9]+")
          VERSION_LINE = re.compile(r"^version:\s*.*$", re.MULTILINE)
          DATE_LINE = re.compile(r"^date-released:\s*.*$", re.MULTILINE)


          def update_footer(text: str, version: str, anchor: str) -> str:
              matches = list(CHANGELOG_A.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(
                      f"expected exactly one wiki/Changelog <a> in footer, found {len(matches)}"
                  )
              match = matches[0]
              open_tag, inner, close = match.group(1), match.group(2), match.group(3)
              new_open, href_n = HREF_FRAG.subn(rf"\1{anchor}", open_tag, count=1)
              if href_n != 1:
                  raise SystemExit("changelog href fragment vNNNN not found on the Changelog <a>")
              new_inner, vis_n = VISIBLE_VER.subn(version, inner, count=1)
              if vis_n != 1:
                  raise SystemExit("visible vX.Y.Z not found inside the Changelog <a>")
              return text[: match.start()] + new_open + new_inner + close + text[match.end()]


          def verify_footer(text: str, version: str, anchor: str) -> None:
              matches = list(CHANGELOG_A.finditer(text))
              if len(matches) != 1:
                  raise SystemExit("footer verification: expected exactly one wiki/Changelog <a>")
              open_tag, inner = matches[0].group(1), matches[0].group(2)
              if f"wiki/Changelog#{anchor}" not in open_tag:
                  raise SystemExit(
                      f"footer verification: href does not contain wiki/Changelog#{anchor}"
                  )
              if version not in inner:
                  raise SystemExit(
                      f"footer verification: Changelog <a> inner text does not contain {version}"
                  )


          def update_citation(text: str, version: str, date: str) -> str:
              if VERSION_LINE.search(text) is None or DATE_LINE.search(text) is None:
                  raise SystemExit("CITATION.cff missing version or date-released line")
              updated = VERSION_LINE.sub(f"version: {version}", text, count=1)
              return DATE_LINE.sub(f'date-released: "{date}"', updated, count=1)


          def verify_citation(text: str, version: str, date: str) -> None:
              if not re.search(rf"^version:\s*{re.escape(version)}\s*$", text, re.MULTILINE):
                  raise SystemExit(f"CITATION.cff verification: version is not {version}")
              if not re.search(
                  rf'^date-released:\s*"{re.escape(date)}"\s*$', text, re.MULTILINE
              ):
                  raise SystemExit(
                      f'CITATION.cff verification: date-released is not "{date}"'
                  )


          def main() -> None:
              version = os.environ["VERSION"]
              date = os.environ["DATE"]
              footer_path = Path(os.environ["FOOTER_FILE"])
              citation_path = Path("CITATION.cff")
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", version):
                  raise SystemExit(f"invalid VERSION {version!r}")
              anchor = "v" + version[1:].replace(".", "")
              if not footer_path.is_file():
                  raise SystemExit(f"Footer file not found: {footer_path}")
              if not citation_path.is_file():
                  raise SystemExit("CITATION.cff not found")

              footer = footer_path.read_text(encoding="utf-8")
              footer = update_footer(footer, version, anchor)
              verify_footer(footer, version, anchor)
              footer_path.write_bytes(footer.encode("utf-8"))

              citation = citation_path.read_text(encoding="utf-8")
              citation = update_citation(citation, version, date)
              verify_citation(citation, version, date)
              citation_path.write_bytes(citation.encode("utf-8"))

              print(f"Footer Changelog <a> is {version} (#{anchor})")
              print(f'CITATION.cff version={version} date-released="{date}"')


          if __name__ == "__main__":
              main()
          PY
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add "$FOOTER_FILE" CITATION.cff
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update citation and footer for release $VERSION"
            git pull --rebase origin main
            git push origin main || {
              echo "Push failed due to upstream changes. Retry release."
              exit 1
            }
          fi

      - name: Set final SHA
        id: final-sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  new_version:
    name: Create new tag
    needs: update_files
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Log-in as AMCR app
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.AISCR_AMCR_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.AISCR_AMCR_ACTIONS_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Check if tag exists
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$NEW_TAG"; then
            echo "Tag already exists!"
            exit 1
          fi

      - name: Create annotated tag
        env:
          NEW_TAG: ${{ inputs.new_tag }}
          RELEASE_SHA: ${{ needs.update_files.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git tag -a "$NEW_TAG" "$RELEASE_SHA" -m "Release $NEW_TAG"
          git push origin "refs/tags/$NEW_TAG"
